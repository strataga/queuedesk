# OPS-02: lightweight CI progression. Unit suites (no Docker) gate first;
# the integration job then stands up the named lab PG + MQ and runs the full
# ./scripts/verify chain. A final step fails the job if any suite was skipped
# or produced no report — skips are never reported as passed.
name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: maven-${{ hashFiles('pom.xml') }}
      - name: plain Java unit suites (no Docker)
        run: unset MQ_APP_PASSWORD; ./mvnw test -DexcludedGroups=integration
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: dashboard unit tests and production build
        run: npm ci --prefix dashboard && npm test --prefix dashboard && npm run build --prefix dashboard
  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: maven-${{ hashFiles('pom.xml') }}
      - name: start named lab Postgres
        run: ./scripts/postgres up
      - name: start and configure lab IBM MQ
        run: ./scripts/mq up && ./scripts/mq setup
      - name: full verify chain (tests, smoke, scenarios)
        run: ./scripts/verify
      - name: fail on skipped or missing suites
        if: always()
        run: |
          test -n "$(ls target/surefire-reports/TEST-*.xml)"
          ! grep -rE "Skipped: [1-9]" target/surefire-reports/*.txt
