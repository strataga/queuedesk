spring.application.name=queuedesk
server.address=127.0.0.1
server.port=8080
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
spring.jackson.deserialization.accept-float-as-int=false
# Local Postgres (see runbook). Credentials via environment; values below are lab defaults only.
spring.datasource.url=${QD_DB_URL:jdbc:postgresql://127.0.0.1:5442/queuedesk}
spring.datasource.username=${QD_DB_USER:queuedesk}
spring.datasource.password=${QD_DB_PASSWORD:queuedesk}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
queuedesk.mq.host=127.0.0.1
queuedesk.mq.port=1414
queuedesk.mq.channel=DEV.APP.SVRCONN
queuedesk.mq.queue-manager=QDESK
queuedesk.mq.user=app
queuedesk.mq.password=${MQ_APP_PASSWORD:queuedesk-lab}
queuedesk.mq.queue-in=QUEUEDESK.INSTRUCTION.IN
queuedesk.publisher.enabled=true
queuedesk.publisher.batch-size=10
queuedesk.publisher.poll-delay-ms=1000
queuedesk.worker.enabled=true
queuedesk.worker.backout-threshold=3
queuedesk.mq.queue-backout=QUEUEDESK.INSTRUCTION.BACKOUT
queuedesk.quarantine.enabled=true
queuedesk.quarantine.poll-delay-ms=15000
queuedesk.reconcile.enabled=true
queuedesk.reconcile.poll-delay-ms=10000
# FAIL-01 crash latches: all default off; halt mode requires the lab-armed
# master (env QUEUEDESK_FAULT_LAB_ARMED=1). Set only by the process owner for
# SC08-style drills — never from HTTP. Tripping halts with exit 99.
queuedesk.fault.lab-armed=false
queuedesk.fault.worker-halt-before-commit=false
queuedesk.fault.worker-halt-after-commit=false
queuedesk.fault.publisher-halt-after-commit=false
# OBS-02/OPS-01: loopback-only actuator surface (the server already binds
# 127.0.0.1); health groups separate liveness (process alive) from readiness
# (dependencies reachable) so an MQ outage never causes a restart loop.
management.endpoints.web.exposure.include=health,metrics
# Details only on failure: the unauthenticated actuator must not print full
# broker/DB exception strings for healthy components. Statuses and component
# presence are unaffected; the dashboard and OpsHealthTest read those.
# Statuses are the contract (liveness/readiness probes, outage drills); detail
# maps can carry broker error strings, so they stay hidden. Boot has no
# on-failure value — components-always/details-never is the closest valid pair.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,mq
management.health.db.enabled=true
management.metrics.distribution.percentiles.queuedesk.admission.duration=0.5,0.95,0.99
management.metrics.distribution.percentiles.queuedesk.endtoend.duration=0.5,0.95,0.99
management.metrics.distribution.percentiles.queuedesk.risk.provider.duration=0.5,0.95,0.99
# B04 risk gate (mock-first ONLY): OFF keeps the base flow untouched, RULES_ONLY
# is the no-provider baseline, RULES_PLUS_MOCK consults the deterministic mock.
# RULES_PLUS_JEV fails boot validation — no live adapter exists in this build.
queuedesk.risk.mode=OFF
queuedesk.risk.feature-version=1.0
queuedesk.risk.question-version=mock-2026-10
queuedesk.risk.policy-version=0.4
queuedesk.risk.provider-deadline-ms=2000
queuedesk.risk.velocity-window-minutes=60
queuedesk.risk.mock-fault=NONE
